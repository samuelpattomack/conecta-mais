<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conecta+ – Protótipo</title>
<style>
:root{box-sizing:border-box;--bg:#f4f4f7;--card:#fff;--tx:#1d1d22;--mut:#5f5f6b;--red:#c8102e;--ok:#1a7f4b;--warn:#fff3cd;--warntx:#664d03;--bd:#dcdce3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--card:#23232b;--tx:#f1f1f5;--mut:#b0b0bc;--red:#ff5c75;--ok:#52d68d;--warn:#3d3410;--warntx:#ffe08a;--bd:#3a3a45}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:18px;line-height:1.45;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;padding:20px 18px 40px}
h1{font-size:26px;margin:0 0 4px;color:var(--red)}h2{font-size:22px;margin:8px 0}.mut{color:var(--mut);font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px;width:100%;background:var(--red);color:#fff;margin-top:10px;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.m{display:flex;gap:12px;align-items:center;cursor:pointer}.m .ic{font-size:30px}.lock{opacity:.5;cursor:default}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.ph{border:2px solid var(--bd);border-radius:14px;padding:12px;background:var(--bg);font-size:16px;text-align:center;margin:10px 0}
.hl{outline:3px solid var(--red);border-radius:8px;padding:6px 10px;display:inline-block;margin:4px 0;background:var(--card)}
.warn{background:var(--warn);color:var(--warntx);border-radius:14px;padding:14px;margin:12px 0;font-size:16px}
.selo{font-size:70px;text-align:center}.ok{color:var(--ok)}
</style></head><body><div class="app" id="app"></div>
<script>
const steps=[
{t:"Abra o navegador",d:"Digite o endereço oficial. Ele termina em .gov.br.",i:'<div class="ph">🌐 <span class="hl">gov.br</span></div>'},
{t:"Toque em “Entrar com gov.br”",d:"É o botão azul no topo da página.",i:'<div class="ph">Portal gov.br<br><span class="hl">👤 Entrar com gov.br</span></div>'},
{t:"Digite seu CPF",d:"Escreva só os números e toque em Continuar.",i:'<div class="ph">CPF<br><span class="hl">000.000.000-00</span><br>[ Continuar ]</div>'},
{t:"Digite sua senha",d:"Ela é só sua. Ninguém do governo pede senha por telefone ou WhatsApp. Esqueceu? Toque em “Esqueci minha senha” e siga as instruções.",i:'<div class="ph">Senha<br><span class="hl">••••••••</span><br>[ Entrar ]</div>'},
{t:"Pronto! Você entrou",d:"Agora você vê seus serviços. Toque em Sair quando terminar.",i:'<div class="ph ok">✅ Bem-vindo(a)!<br><span class="hl">Meus serviços</span></div>'}];
let v="home",n=0;const A=document.getElementById("app");
const go=(x,k=0)=>{v=x;n=k;r();scrollTo(0,0)};
function r(){
if(v=="home")A.innerHTML=`<h1>Conecta+</h1><p class="mut">Missões de Autonomia Digital. Aprenda uma tarefa de cada vez, no seu ritmo.</p>
<div class="card m" onclick="go('mission')"><span class="ic">🏛️</span><div><b>Missão 1: Entrar no gov.br</b><br><span class="mut">5 passos • 15 min</span></div></div>
<div class="card m lock"><span class="ic">💸</span><div><b>Missão 2: Fazer um Pix</b><br><span class="mut">Em breve</span></div></div>
<div class="card m lock"><span class="ic">🩺</span><div><b>Missão 3: Agendar consulta</b><br><span class="mut">Em breve</span></div></div>
<div class="card"><b>🚨 Dica de segurança</b><br><span class="mut">Desconfie de quem tem pressa e pede seus códigos.</span></div>`;
else if(v=="mission")A.innerHTML=`<p class="mut">Missão 1 • Entrar no gov.br</p><h2>Antes de começar</h2><div class="card"><b>Por que entrar no gov.br?</b><br>Com uma única conta você consulta benefícios, documentos e agenda serviços sem filas e sem deslocamento.<br><br>Tenha em mãos: seu celular com internet, seu CPF e, se lembrar, sua senha.<br><br>Um monitor digital vai ajudar, mas é você quem toca na tela. 👍</div><button onclick="go('step',0)">Começar</button><button class="sec" onclick="go('home')">Voltar</button>`;
else if(v=="step"){const s=steps[n];A.innerHTML=`<p class="mut">Passo ${n+1} de ${steps.length}</p><div class="bar"><i style="width:${(n+1)/steps.length*100}%"></i></div><h2>${s.t}</h2><p>${s.d}</p>${s.i}
<button onclick="${n<steps.length-1?`go('step',${n+1})`:`go('alert')`}">${n<steps.length-1?'Próximo':'Concluir'}</button>
<button class="sec" onclick="${n?`go('step',${n-1})`:`go('mission')`}">Voltar</button>`}
else if(v=="alert")A.innerHTML=`<h2>🚨 Alerta de golpe</h2><div class="warn"><b>Sinais de que é golpe:</b><br>• Mensagem com link e muita pressa<br>• Pedem senha, código ou foto do documento<br>• O endereço do site não termina em .gov.br</div><p><b>Na dúvida:</b> pare, não clique e pergunte a alguém de confiança.</p><button onclick="go('done')">Entendi</button>`;
else A.innerHTML=`<div class="selo">🏅</div><h2 style="text-align:center">Missão cumprida!</h2><p class="mut" style="text-align:center">Agora tente repetir sozinho(a), sem ajuda.</p><button onclick="go('home')">Voltar ao início</button><button class="sec" onclick="go('step',0)">Praticar de novo</button>`}
r();
</script></body></html>
